<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administracija | IMMANIS</title><link rel="stylesheet" href="style.css"></head><body><header><a href="index.html"><img src="assets/logo.png" alt="IMMANIS"></a><a href="index.html">Natrag na stranicu</a></header><main><div class="hero" style="padding:45px 7%"><div class="eyebrow">PRIVATNI PORTAL</div><h1>Administracija</h1></div><section><p id="status" role="status"></p><form id="login" class="native-form"><h2>Prijava</h2><label>E-mail<input type="email" name="email" required autocomplete="username"></label><label>Lozinka<input type="password" name="password" required autocomplete="current-password"></label><button class="btn">Prijavi se</button></form><div id="portal" hidden><button class="btn" id="logout">Odjava</button> <button class="btn" id="refresh">Osvježi upite</button><h2>Zaprimljeni upiti</h2><p id="counts"></p><label>Pretraži<input id="search" type="search"></label><label>Vrsta<select id="kind"><option value="">Sve</option><option>knjigovodstvo</option><option>tehnika</option><option>karijera</option><option>kontakt</option></select></label><button class="btn" id="export">Izvoz CSV (Excel)</button><div id="inbox"></div><hr><h2>Uređivanje javnog sadržaja</h2><p>Dodaj ili uredi projekte, novosti i natječaje. Fotografije unesi kao HTTPS poveznice na slike s pravom korištenja. Ne unositi osobne podatke klijenata.</p><div id="editor"></div><button class="btn" id="save">Objavi promjene</button></div></section></main><script src="config.js"></script><script src="baza.js"></script><script src="sadrzaj.js"></script><script src="admin.js"></script></body></html>
